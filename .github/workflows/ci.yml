name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WPMOverlay.sln

      - name: Build
        run: dotnet build WPMOverlay.sln -c Release --no-restore

      - name: Test
        run: dotnet test WPMOverlay.sln -c Release --no-build --verbosity normal
