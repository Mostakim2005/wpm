name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-portable:
    name: Publish portable executable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WPMOverlay.sln

      - name: Test
        run: dotnet test WPMOverlay.sln -c Release --verbosity normal

      - name: Publish single-file portable build
        run: >
          dotnet publish src/WPMOverlay/WPMOverlay.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Name the release asset and generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $source = "artifacts/publish/WPMOverlay.exe"
          if (!(Test-Path $source)) { throw "Publish output was not produced." }
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $assetName = "WPMOverlay-${{ github.ref_name }}-Portable.exe"
          $dest = "artifacts/release/$assetName"
          Copy-Item $source $dest
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          "$hash  $assetName" | Out-File -FilePath "artifacts/release/SHA256SUMS.txt" -Encoding ascii

      - name: Attach executable and checksums to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
